services:

  context:
    build:
      context: .
      dockerfile: boutiques/context/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        SELF_CONTAINED: ${SELF_CONTAINED:-false}
    image: context:1.0.0
    container_name: context
    labels:
      io.atelier.boutique: "CONTEXT"
      io.atelier.image.immutable: "context:1.0.0"
      org.opencontainers.image.version: "1.0.0"
      org.opencontainers.image.description: "context-bench Subsystem"
    restart: unless-stopped
    environment:
      - "ASPNETCORE_ENVIRONMENT=Production"


    ports:
      - "8080:8080"

      - "8081:8081"

      - "9090:9090"


    volumes:
      - ./docker/certs:/https:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "3"

          memory: 4096M


    read_only: true
    tmpfs:
      - /tmp
      - /var/atelier
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - atelier-network


