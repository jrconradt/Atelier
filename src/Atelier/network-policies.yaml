apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-zone-policy
  labels:
    io.atelier.zone: "application"
  annotations:
    io.atelier.requires-mtls: "true"
spec:
  podSelector:
    matchLabels:
      io.atelier.zone: "application"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.atelier.zone: "external"
        - podSelector:
            matchLabels:
              io.atelier.zone: "application"
        - podSelector:
            matchLabels:
              io.atelier.zone: "management"
  egress:
    - to:
        - podSelector:
            matchLabels:
              io.atelier.zone: "application"
        - podSelector:
            matchLabels:
              io.atelier.zone: "data"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-zone-policy
  labels:
    io.atelier.zone: "security"
  annotations:
    io.atelier.requires-mtls: "true"
spec:
  podSelector:
    matchLabels:
      io.atelier.zone: "security"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.atelier.zone: "application"
        - podSelector:
            matchLabels:
              io.atelier.zone: "management"
  egress:
    []
