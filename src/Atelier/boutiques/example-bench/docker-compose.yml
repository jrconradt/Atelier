services:

  example:
    build:
      context: ../..
      dockerfile: boutiques/example/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        SELF_CONTAINED: ${SELF_CONTAINED:-false}
    image: example:1.0.0
    container_name: example
    labels:
      io.atelier.boutique: "EXAMPLE"
      io.atelier.image.immutable: "example:1.0.0"
      org.opencontainers.image.version: "1.0.0"
      org.opencontainers.image.description: "example-bench Subsystem"
    restart: unless-stopped
    environment:
      - "ASPNETCORE_ENVIRONMENT=Production"


    ports:
      - "8280:8080"

      - "8281:8081"

      - "9290:9090"


    volumes:
      - ../../docker/certs:/https:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "3"

          memory: 4096M


    read_only: true
    tmpfs:
      - /tmp
      - /var/atelier
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - atelier-network


networks:
  atelier-network:
    driver: bridge

